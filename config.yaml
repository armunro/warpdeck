iconRoot: "C:\\Tools\\fontawesome-pro-7.3.1-desktop\\svgs"
brightness: 100
layers:
  - name: Default
    priority: 0
    theme: "cyber"
    showEmptyButtons: true
    color: "#000000"
    buttons:
      # Window Management (Electric Blue: #0070F3) - Locked so window controls stay on all screens
      - index: 0
        color: "#0070F3"
        caption: "Snap Left"
        icon: "regular/arrow-left.svg"
        locked: true
        action: { type: macro, value: "{{win+left}}" }
      - index: 1
        color: "#0070F3"
        caption: "Snap Right"
        icon: "regular/arrow-right.svg"
        locked: true
        action: { type: macro, value: "{{win+right}}" }
      - index: 2
        color: "#0070F3"
        caption: "Maximize"
        icon: "regular/window-maximize.svg"
        locked: true
        action: { type: macro, value: "{{win+up}}" }
      - index: 3
        color: "#0070F3"
        caption: "Minimize"
        icon: "regular/window-minimize.svg"
        locked: true
        action: { type: macro, value: "{{win+down}}" }

      # Navigation / Desktop (Electric Purple: #7928CA)
      - index: 4
        color: "#7928CA"
        caption: "Task View"
        icon: "regular/table-columns.svg"
        action: { type: macro, value: "{{win+tab}}" }
      - index: 5
        color: "#7928CA"
        caption: "New Desktop"
        icon: "regular/desktop.svg"
        action: { type: macro, value: "{{win+ctrl+d}}" }
      - index: 6
        color: "#7928CA"
        caption: "Next Desktop"
        icon: "regular/angles-right.svg"
        action: { type: macro, value: "{{win+ctrl+right}}" }
      - index: 7
        color: "#7928CA"
        caption: "Prev Desktop"
        icon: "regular/angles-left.svg"
        action: { type: macro, value: "{{win+ctrl+left}}" }

      # System Tools (Vibrant Orange: #FF6B00)
      - index: 8
        color: "#FF6B00"
        caption: "Settings"
        icon: "regular/gear.svg"
        action: { type: macro, value: "{{win+i}}" }
      - index: 9
        color: "#FF6B00"
        caption: "Explorer"
        icon: "regular/folder.svg"
        action: { type: macro, value: "{{win+e}}" }
      - index: 10
        color: "#FF6B00"
        caption: "Search"
        icon: "regular/magnifying-glass.svg"
        action: { type: macro, value: "{{win+s}}" }
      - index: 11
        color: "#FF6B00"
        caption: "Run"
        icon: "regular/play.svg"
        action: { type: macro, value: "{{win+r}}" }

      # Media / Volume (Neon Green: #00E676)
      - index: 12
        color: "#00E676"
        caption: "Mute"
        icon: "regular/volume-xmark.svg"
        action: { type: macro, value: "{{win+alt+m}}" } # Note: Win+Alt+M is Game Bar mute, standard Win doesn't have a direct toggle often without special keys
      - index: 13
        color: "#00E676"
        caption: "Vol Up"
        icon: "regular/volume-high.svg"
        action: { type: macro, value: "{{f3}}" } # Often mapped on laptops, but standard KB varies.
      - index: 14
        color: "#00E676"
        caption: "Vol Down"
        icon: "regular/volume-low.svg"
        action: { type: macro, value: "{{f2}}" }
      - index: 15
        color: "#00E676"
        caption: "Play/Pause"
        icon: "regular/play-pause.svg"
        action: { type: macro, value: "{{space}}" } # Context dependent

      # Productivity / Screenshots (Vibrant Yellow: #FFD600)
      - index: 16
        color: "#FFD600"
        caption: "Snippet"
        icon: "regular/scissors.svg"
        action: { type: macro, value: "{{win+shift+s}}" }
      - index: 17
        color: "#FFD600"
        caption: "Clipboard"
        icon: "regular/clipboard.svg"
        action: { type: macro, value: "{{win+v}}" }
      - index: 18
        color: "#FFD600"
        caption: "Emoji"
        icon: "regular/face-smile.svg"
        action: { type: macro, value: "{{win+.}}" }
      - index: 19
        color: "#FFD600"
        caption: "Action Center"
        icon: "regular/bell.svg"
        action: { type: macro, value: "{{win+a}}" }

      # Browser / Web (Vibrant Magenta: #E040FB)
      - index: 20
        color: "#E040FB"
        caption: "New Tab"
        icon: "regular/plus.svg"
        action: { type: macro, value: "{{ctrl+t}}" }
      - index: 21
        color: "#E040FB"
        caption: "Close Tab"
        icon: "regular/xmark.svg"
        action: { type: macro, value: "{{ctrl+w}}" }
      - index: 22
        color: "#E040FB"
        caption: "Reopen Tab"
        icon: "regular/arrow-rotate-left.svg"
        action: { type: macro, value: "{{ctrl+shift+t}}" }
      - index: 23
        color: "#E040FB"
        caption: "Private"
        icon: "regular/user-secret.svg"
        action: { type: macro, value: "{{ctrl+shift+n}}" }

      # App Switching (Electric Cyan: #00E5FF)
      - index: 24
        color: "#00E5FF"
        caption: "Alt+Tab"
        icon: "regular/window-restore.svg"
        action: { type: macro, value: "{{alt+tab}}" }
      - index: 25
        color: "#00E5FF"
        caption: "Show Desktop"
        icon: "regular/display.svg"
        action: { type: macro, value: "{{win+d}}" }
      - index: 26
        color: "#00E5FF"
        caption: "Lock"
        icon: "regular/lock.svg"
        action: { type: macro, value: "{{win+l}}" }
      - index: 27
        color: "#00E5FF"
        caption: "Task Mgr"
        icon: "regular/chart-simple.svg"
        action: { type: macro, value: "{{ctrl+shift+esc}}" }

      # General (White: #FFFFFF)
      - index: 28
        color: "#FFFFFF"
        caption: "Undo"
        icon: "regular/rotate-left.svg"
        action: { type: macro, value: "{{ctrl+z}}" }
      - index: 29
        color: "#FFFFFF"
        caption: "Redo"
        icon: "regular/rotate-right.svg"
        action: { type: macro, value: "{{ctrl+y}}" }
      - index: 30
        color: "#FFFFFF"
        caption: "Copy"
        icon: "regular/copy.svg"
        action: { type: macro, value: "{{ctrl+c}}" }
      - index: 31
        color: "#FFFFFF"
        caption: "Paste"
        icon: "regular/paste.svg"
        action: { type: macro, value: "{{ctrl+v}}" }
  - name: Notepad
    priority: 10
    color: "#00E676" # Vibrant Green
    fontColor: "#000000" # Black font for green background
    condition:
      processName: notepad
    buttons:
      - index: 0
        color: "#FFFFFF"
        # fontColor will be automatically black because #FFFFFF is light
        caption: "Save"
        icon: "regular/floppy-disk.svg"
        action:
          type: macro
          value: "thisissometext{{ctrl+s}}" # Text + Save
      - index: 1
        color: "#000000"
        fontColor: "#FF1744" # Vibrant Red font on black
        caption: "Close"
        icon: "regular/xmark.svg"
        action:
          type: macro
          value: "{{alt+f4}}" # Close
  - name: Calculator
    priority: 10
    color: "#FF1744" # Vibrant Red
    condition:
      windowTitle: Calculator
    buttons:
      - index: 0
        color: "#0070F3"
        caption: "Tasks"
        icon: "regular/calculator.svg"
        action:
          type: macro
          value: "{{win+tab}}" # Task View
      - index: 1
        color: "#FFD600"
        caption: "Close"
        icon: "regular/xmark.svg"
        action:
          type: macro
          value: "{{alt+f4}}" # Close
  - name: Rider
    priority: 20
    theme: "korry"
    color: "#000000" # Black background
    condition:
      processName: Rider64
    buttons:
      # Navigation (Electric Purple: #7928CA)
      - index: 0
        color: "#7928CA"
        caption: "Search Everywhere"
        icon: "regular/magnifying-glass.svg"
        action: { type: macro, value: "{{ctrl+t}}" }
      - index: 1
        color: "#7928CA"
        caption: "Go to File"
        icon: "regular/file.svg"
        action: { type: macro, value: "{{ctrl+shift+n}}" }
      - index: 2
        color: "#7928CA"
        caption: "Go to Symbol"
        icon: "regular/shapes.svg"
        action: { type: macro, value: "{{ctrl+alt+shift+n}}" }
      - index: 3
        color: "#7928CA"
        caption: "Find Usages"
        icon: "regular/cube.svg"
        action: { type: macro, value: "{{shift+f12}}" }
      
      # Editing / Context (Vibrant Orange: #FF6B00)
      - index: 4
        color: "#FF6B00"
        caption: "Context Action"
        icon: "regular/lightbulb.svg"
        action: { type: macro, value: "{{alt+enter}}" }
      - index: 5
        color: "#FF6B00"
        caption: "Rename"
        icon: "regular/i-cursor.svg"
        action: { type: macro, value: "{{f2}}" }
      - index: 6
        color: "#FF6B00"
        caption: "Refactor This"
        icon: "regular/wand-magic-sparkles.svg"
        action: { type: macro, value: "{{ctrl+shift+r}}" }
      - index: 7
        color: "#FF6B00"
        caption: "Format Code"
        icon: "regular/align-left.svg"
        action: { type: macro, value: "{{ctrl+alt+l}}" }

      # Build & Run (Neon Green: #00E676, Crimson: #FF1744)
      - index: 8
        color: "#00E676"
        caption: "Build"
        icon: "regular/hammer.svg"
        action: { type: macro, value: "{{ctrl+shift+b}}" }
      - index: 9
        color: "#00E676"
        caption: "Run"
        icon: "regular/play.svg"
        action: { type: macro, value: "{{ctrl+f5}}" }
      - index: 10
        color: "#00E676"
        caption: "Debug"
        icon: "regular/bug.svg"
        action: { type: macro, value: "{{f5}}" }
      - index: 11
        color: "#FF1744"
        caption: "Stop"
        icon: "regular/stop.svg"
        action: { type: macro, value: "{{shift+f5}}" }

      # Debugging (Electric Blue: #0070F3)
      - index: 12
        color: "#0070F3"
        caption: "Step Over"
        icon: "regular/forward-step.svg"
        action: { type: macro, value: "{{f8}}" }
      - index: 13
        color: "#0070F3"
        caption: "Step Into"
        icon: "regular/arrow-turn-down-right.svg"
        action: { type: macro, value: "{{f7}}" }
      - index: 14
        color: "#0070F3"
        caption: "Step Out"
        icon: "regular/arrow-turn-up.svg"
        action: { type: macro, value: "{{shift+f8}}" }
      - index: 15
        color: "#0070F3"
        caption: "Resume"
        icon: "regular/forward.svg"
        action: { type: macro, value: "{{f5}}" }

      # Version Control (Vibrant Yellow: #FFD600)
      - index: 16
        color: "#FFD600"
        caption: "Commit"
        icon: "regular/code-commit.svg"
        action: { type: macro, value: "{{ctrl+k}}" }
      - index: 17
        color: "#FFD600"
        caption: "Push"
        icon: "regular/arrow-up.svg"
        action: { type: macro, value: "{{ctrl+shift+k}}" }
      - index: 18
        color: "#FFD600"
        caption: "Pull"
        icon: "regular/arrow-down.svg"
        action: { type: macro, value: "{{ctrl+alt+w}}" }
      - index: 19
        color: "#FFD600"
        caption: "History"
        icon: "regular/clock-rotate-left.svg"
        action: { type: macro, value: "{{alt+`}}" }

      # Code structure (Vibrant Magenta: #E040FB)
      - index: 20
        color: "#E040FB"
        caption: "File Structure"
        icon: "regular/list-tree.svg"
        action: { type: macro, value: "{{ctrl+f11}}" }
      - index: 21
        color: "#E040FB"
        caption: "Hierarchy"
        icon: "regular/sitemap.svg"
        action: { type: macro, value: "{{ctrl+e}}" }
      - index: 22
        color: "#E040FB"
        caption: "Terminal"
        icon: "regular/terminal.svg"
        action: { type: macro, value: "{{ctrl+alt+1}}" }
      - index: 23
        color: "#E040FB"
        caption: "Solution"
        icon: "regular/folder-tree.svg"
        action: { type: macro, value: "{{alt+1}}" }

      # Miscellaneous (White: #FFFFFF)
      - index: 24
        color: "#FFFFFF"
        caption: "Comment"
        icon: "regular/comment.svg"
        action: { type: macro, value: "{{ctrl+/}}" }
      - index: 25
        color: "#FFFFFF"
        caption: "Inspect"
        icon: "regular/shield-halved.svg"
        action: { type: macro, value: "{{ctrl+alt+shift+i}}" }
      - index: 26
        color: "#FFFFFF"
        caption: "Implement"
        icon: "regular/circle-nodes.svg"
        action: { type: macro, value: "{{ctrl+i}}" }
      - index: 27
        color: "#FFFFFF"
        caption: "Override"
        icon: "regular/circle-arrow-down.svg"
        action: { type: macro, value: "{{ctrl+o}}" }

      # Navigation bookmarks (Electric Cyan: #00E5FF)
      - index: 28
        color: "#00E5FF"
        caption: "Toggle Bookmark"
        icon: "regular/bookmark.svg"
        action: { type: macro, value: "{{ctrl+f11}}" }
      - index: 29
        color: "#00E5FF"
        caption: "Show Bookmarks"
        icon: "regular/book-bookmark.svg"
        action: { type: macro, value: "{{shift+f11}}" }
      - index: 30
        color: "#FF007F" # Vibrant Rose/Pink for UI
        caption: "Rider UI"
        icon: "regular/table-cells.svg"
        action: { type: macro, value: "{{ctrl+shift+f12}}" }
      - index: 31
        color: "#FF1744" # Vibrant Red for Tab Actions
        caption: "Close Tab"
        icon: "regular/xmark.svg"
        action: { type: macro, value: "{{ctrl+f4}}" }
